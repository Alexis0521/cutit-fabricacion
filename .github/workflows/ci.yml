
name: CI - Fabricacion API

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Revisar codigo con Ruff
        run: ruff check app tests

      - name: Revisar tipos con Mypy
        run: mypy --disallow-untyped-defs app

      - name: Ejecutar pruebas y medir cobertura
        run: python -m pytest --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=80

      - name: Construir imagen Docker
        run: docker build -t cutit-fabricacion .

      - name: Login en Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen Docker
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            alexis2105/cutit-fabricacion:${{ github.ref == 'refs/heads/main' && 'latest' || 'develop' }}
            alexis2105/cutit-fabricacion:${{ github.sha }}

      - name: Analizar codigo con SonarQube Cloud 
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      
  deploy-production:
    name: Deploy to AWS EC2
    runs-on: self-hosted
    needs: quality-and-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Descargar configuracion de despliegue
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Actualizar API en EC2
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd /home/ubuntu/cutit-fabricacion-repo
          cp "$GITHUB_WORKSPACE/docker-compose.yml" docker-compose.yml
          docker compose pull api
          docker compose run --rm --no-deps api alembic upgrade head
          docker compose up -d --no-deps api
